<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DU DU LONG | 杜杜龍 - 個人品牌展覽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --bg: #fdfdfd; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg); overflow: hidden; }
        .serif { font-family: 'Noto Serif TC', serif; }
        
        /* 頁面切換動畫 */
        .page { 
            position: absolute; inset: 0; opacity: 0; pointer-events: none; 
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            transform: translateY(20px);
        }
        .page.active { opacity: 1; pointer-events: auto; transform: translateY(0); }

        /* 選單樣式 */
        .menu-overlay {
            position: fixed; inset: 0; background: rgba(18,18,18,0.98); z-index: 100;
            display: none; flex-direction: column; justify-content: center; padding: 10%;
            color: white;
        }
        .menu-item { font-size: 3rem; margin: 1rem 0; cursor: pointer; transition: 0.3s; }
        .menu-item:hover { color: var(--gold); padding-left: 20px; }

        /* 海外亮點卡片 */
        .travel-img { filter: grayscale(100%); transition: 0.5s; }
        .active .travel-img { filter: grayscale(0%); scale: 1.05; }
    </style>
</head>
<body>

    <!-- 頂部導覽 -->
    <nav class="fixed top-0 w-full z-50 p-6 flex justify-between items-center mix-blend-difference text-white">
        <div class="text-xl font-bold tracking-widest serif cursor-pointer" onclick="goToPage(0)">DU DU LONG</div>
        <button onclick="toggleMenu(true)" class="p-2 border border-white/30 rounded-full">選單</button>
    </nav>

    <!-- 進度條 -->
    <div class="fixed top-0 left-0 h-1 bg-[#c5a059] z-[60] transition-all duration-500" id="progress" style="width: 5%"></div>

    <!-- 全螢幕選單 -->
    <div class="menu-overlay" id="menu">
        <button onclick="toggleMenu(false)" class="absolute top-10 right-10 text-4xl">✕</button>
        <div class="text-xs tracking-[0.5em] text-zinc-500 mb-8 uppercase">Exhibition Menu</div>
        <div class="menu-item serif" onclick="jumpToCategory(1)">01 生平故事</div>
        <div class="menu-item serif" onclick="jumpToCategory(6)">02 專業成就</div>
        <div class="menu-item serif" onclick="jumpToCategory(11)">03 海外亮點</div>
        <div class="menu-item serif" onclick="jumpToCategory(17)">04 健康願景</div>
    </div>

    <!-- 內容容器 -->
    <main id="content-container">
        <!-- 頁面會由 JavaScript 動態生成 -->
    </main>

    <!-- 底部控制 -->
    <div class="fixed bottom-10 right-10 flex gap-4 z-50">
        <button onclick="changePage(-1)" class="p-4 border border-zinc-300 hover:bg-zinc-100 transition">←</button>
        <button onclick="changePage(1)" class="p-4 bg-zinc-900 text-white hover:bg-zinc-700 transition">→</button>
    </div>
    <div class="fixed bottom-12 left-10 text-sm italic text-zinc-400 font-serif" id="page-number">01 / 22</div>

    <script>
        const pagesData = [
            { cat: "HOME", title: "杜杜龍", sub: "一個關於跨界、健康與夢想的個人展覽", bg: "bg-zinc-950 text-white" },
            // 生平故事 (1-5)
            { cat: "STORY", title: "學術的奠基", sub: "曾任大學資管系教師，嚴謹的邏輯是我的核心。" },
            { cat: "STORY", title: "創業的火花", sub: "白手起家創立第一間印刷店，學習市場的語言。" },
            { cat: "STORY", title: "事業的版圖", sub: "擴展至三家連鎖店，並榮獲母校傑出校友。" },
            { cat: "STORY", title: "杜阿嬤的守護", sub: "為了 90 歲阿嬤的健康，我開始尋找生命的轉機。" },
            { cat: "STORY", title: "角色的轉換", sub: "從資管名師到健康管理師，這是一場溫暖的蛻變。" },
            // 專業成就 (6-10)
            { cat: "PROFESSIONAL", title: "北醫健康管理師", sub: "取得專業認證，用數據守護生命品質。" },
            { cat: "PROFESSIONAL", title: "安麗紐崔萊代理", sub: "選擇全球領先品牌，因為品質是唯一的語言。" },
            { cat: "PROFESSIONAL", title: "91年的科研力", sub: "深信紐崔萊溯源精神，從種子到成品嚴格把關。" },
            { cat: "PROFESSIONAL", title: "有機農場的契機", sub: "與自然和諧共處，將大地的精華帶給每一位朋友。" },
            { cat: "PROFESSIONAL", title: "團隊的領導者", sub: "不僅是代理產品，更是帶領夥伴走向更好的人生。" },
            // 海外亮點 (11-16)
            { cat: "TRAVEL", title: "寰宇世界：亮點", sub: "選擇一種生活方式，而不僅僅是一份職業。", bg: "bg-zinc-900 text-white" },
            { cat: "TRAVEL", title: "西澳珀斯：酒莊", sub: "頂級酒莊包場午宴，感受南半球最純淨的陽光。", bg: "bg-zinc-800 text-white" },
            { cat: "TRAVEL", title: "西澳珀斯：挑戰", sub: "高空滑索極限體驗，勇氣是跨向夢想的唯一路徑。", bg: "bg-zinc-900 text-white" },
            { cat: "TRAVEL", title: "專屬榮耀：黃金幣", sub: "客製化紀念幣，見證我們在世界的足跡。", bg: "bg-zinc-800 text-white" },
            { cat: "TRAVEL", title: "巴黎：凡爾賽宮", sub: "凡爾賽包場皇室晚宴，品味極致生活的浪漫。", bg: "bg-zinc-900 text-white" },
            { cat: "TRAVEL", title: "巴黎：塞納河畔", sub: "在美酒與星光下，體驗安麗給予的最高尊重。", bg: "bg-zinc-800 text-white" },
            // 健康願景 (17-21)
            { cat: "VISION", title: "小水滴融入大海", sub: "個人力量有限，但團隊與系統的力量無邊無際。" },
            { cat: "VISION", title: "守護與傳承", sub: "因為愛學習營養，因為健康我們擁抱真正的自由。" },
            { cat: "VISION", title: "夢想的主動權", sub: "為夢想而忙碌，不要因忙碌而忘記為何夢想。" },
            { cat: "VISION", title: "出走世界", sub: "誠邀您與我一同看見世界，成就非凡人生。" },
            { cat: "CONTACT", title: "期待相遇", sub: "杜杜龍個人品牌展覽，感謝您的蒞臨。", bg: "bg-zinc-950 text-white" }
        ];

        let currentPage = 0;

        function renderPages() {
            const container = document.getElementById('content-container');
            container.innerHTML = pagesData.map((p, i) => `
                <div class="page flex items-center justify-center text-center p-10 ${p.bg || ''} ${i === 0 ? 'active' : ''}">
                    <div class="max-w-4xl">
                        <div class="text-[#c5a059] tracking-[0.5em] mb-4 text-xs">${p.cat}</div>
                        <h1 class="text-5xl md:text-8xl serif font-bold mb-8 leading-tight">${p.title}</h1>
                        <p class="text-xl md:text-2xl font-light opacity-80 leading-relaxed">${p.sub}</p>
                    </div>
                </div>
            `).join('');
        }

        function changePage(dir) {
            const total = pagesData.length;
            const target = currentPage + dir;
            if (target >= 0 && target < total) {
                goToPage(target);
            }
        }

        function goToPage(index) {
            const pages = document.querySelectorAll('.page');
            pages[currentPage].classList.remove('active');
            currentPage = index;
            pages[currentPage].classList.add('active');
            
            // 更新進度與頁碼
            document.getElementById('progress').style.width = `${((index + 1) / pagesData.length) * 100}%`;
            document.getElementById('page-number').innerText = `${String(index + 1).padStart(2, '0')} / ${pagesData.length}`;
        }

        function toggleMenu(show) {
            document.getElementById('menu').style.display = show ? 'flex' : 'none';
        }

        function jumpToCategory(index) {
            goToPage(index);
            toggleMenu(false);
        }

        window.onload = renderPages;
    </script>
</body>
</html>
